<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 460" width="940" height="460" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .box  { fill:#ffffff; stroke:#cbd5e1; stroke-width:1.5; rx:10; }
      .tint { fill:#eef2ff; stroke:#c7d2fe; }
      .warn { fill:#fffbeb; stroke:#fcd34d; }
      .good { fill:#ecfdf5; stroke:#6ee7b7; }
      .t    { font-size:13px; fill:#0f172a; font-weight:600; }
      .s    { font-size:11px; fill:#475569; }
      .n    { font-size:11px; fill:#64748b; font-style:italic; }
      .step { font-size:11px; fill:#4338ca; font-weight:700; }
      .lbl  { font-size:10px; fill:#64748b; }
      .ln   { stroke:#64748b; stroke-width:1.4; fill:none; marker-end:url(#a); }
    </style>
  </defs>

  <text x="24" y="30" font-size="15" font-weight="700" fill="#0f172a">Deploying VendorGate to a tenant</text>
  <text x="24" y="50" class="n">Everything tenant-specific is a GUID or an org name, driven from one map file.</text>

  <!-- row 1 -->
  <rect class="box tint" x="24"  y="72" width="200" height="88"/>
  <text x="40" y="94"  class="step">1 · Provision</text>
  <text x="40" y="114" class="t">Data Fabric</text>
  <text x="40" y="132" class="s">3 choice sets, 3 entities</text>
  <text x="40" y="148" class="s">provision-tenant.js</text>

  <rect class="box tint" x="264" y="72" width="200" height="88"/>
  <text x="280" y="94"  class="step">2 · Seed</text>
  <text x="280" y="114" class="t">Screening register</text>
  <text x="280" y="132" class="s">real OFAC SDN rows</text>
  <text x="280" y="148" class="s">copy-screening-list.js</text>

  <rect class="box warn" x="504" y="72" width="200" height="88"/>
  <text x="520" y="94"  class="step">3 · Connect</text>
  <text x="520" y="114" class="t">3 IS connections</text>
  <text x="520" y="132" class="s">activities · trigger · GenAI</text>
  <text x="520" y="148" class="s">needs OAuth consent</text>

  <rect class="box tint" x="744" y="72" width="172" height="88"/>
  <text x="760" y="94"  class="step">4 · Repoint</text>
  <text x="760" y="114" class="t">Migrate IDs</text>
  <text x="760" y="132" class="s">one map file</text>
  <text x="760" y="148" class="s">migrate-ids.js</text>

  <line class="ln" x1="224" y1="116" x2="258" y2="116"/>
  <line class="ln" x1="464" y1="116" x2="498" y2="116"/>
  <line class="ln" x1="704" y1="116" x2="738" y2="116"/>

  <!-- row 2 -->
  <rect class="box" x="24"  y="216" width="200" height="104"/>
  <text x="40" y="238" class="step">5 · Package</text>
  <text x="40" y="258" class="t">pack → patch → publish</text>
  <text x="40" y="276" class="s">dedupe connection rows</text>
  <text x="40" y="292" class="s">pin trigger connection</text>
  <text x="40" y="308" class="s">repack as plain zip</text>

  <rect class="box" x="264" y="216" width="200" height="104"/>
  <text x="280" y="238" class="step">6 · Deploy</text>
  <text x="280" y="258" class="t">solution deploy run</text>
  <text x="280" y="276" class="s">creates the run folder</text>
  <text x="280" y="292" class="s">and activates</text>

  <rect class="box warn" x="504" y="216" width="200" height="104"/>
  <text x="520" y="238" class="step">7 · Authorise</text>
  <text x="520" y="258" class="t">runtime account</text>
  <text x="520" y="276" class="s">Data Fabric entity access</text>
  <text x="520" y="292" class="s">folder roles + trigger enable</text>

  <rect class="box good" x="744" y="216" width="172" height="104"/>
  <text x="760" y="238" class="step">8 · Portal</text>
  <text x="760" y="258" class="t">Coded App</text>
  <text x="760" y="276" class="s">public PKCE app</text>
  <text x="760" y="292" class="s">user-delegated scopes</text>

  <line class="ln" x1="224" y1="268" x2="258" y2="268"/>
  <line class="ln" x1="464" y1="268" x2="498" y2="268"/>
  <line class="ln" x1="704" y1="268" x2="738" y2="268"/>

  <!-- wrap from row1 to row2 -->
  <path class="ln" d="M830 160 L830 188 L24 188 L24 212"/>
  <text x="430" y="182" class="lbl">solution now points at the new tenant</text>

  <!-- result -->
  <rect class="box good" x="24" y="368" width="892" height="64"/>
  <text x="40" y="392" class="t">Result — a portal submission writes to Data Fabric, the Record Created trigger starts a process instance within seconds,</text>
  <text x="40" y="412" class="t">and the three agents run under the deployed runtime through to Provisioned.</text>
</svg>
